name: iosApp
options:
  bundleIdPrefix: az.sananhaji
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: az.sananhaji.quranoxu
        PRODUCT_NAME: "Quran Oxu"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        DEVELOPMENT_TEAM: ""
        ENABLE_BITCODE: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
          - $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS:
          - "-framework"
          - "ComposeApp"
    dependencies:
      - framework: ../composeApp/build/bin/iosSimulatorArm64/debugFramework/ComposeApp.framework
        embed: true
    preBuildScripts:
      - name: Compile and Embed Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
